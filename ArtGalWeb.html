<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtHub Full Page with Login & Search</title>
<style>
  * { 
    margin:0; 
    padding:0; 
    box-sizing:border-box; 
    font-family: Arial, sans-serif; 
  }

  body { 
    background: #f5f5f5; 
    color: #333; 
    transition:0.3s; 
  }

  :root {
    --primary-color: orange;
  }

  /* LOGIN PAGE */
  #loginPage {
    width:100%; 
    height:100vh; 
    display:flex; 
    flex-direction:column;
    justify-content:center; 
    align-items:center; 
    background:#fff;
  }

  #loginPage h1 { 
    margin-bottom: 20px; 
    color: var(--primary-color); 
  }

  #loginPage input, #loginPage select {
    width: 300px; 
    padding: 12px; 
    margin: 8px 0; 
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  #loginPage button {
    width: 300px; 
    padding: 12px; 
    background: var(--primary-color); 
    color:white;
    border:none; 
    border-radius:8px; 
    cursor:pointer;
  }

  #loginMessage { margin-top:10px; font-weight:bold; }

  /* MAIN CONTENT */
  #mainContent { display:none; padding:20px; }

  header, footer { 
    background: var(--primary-color); 
    color:white; 
    text-align:center; 
    padding:15px; 
    border-radius:8px; 
  }

  nav {
    width:100%; 
    background:#fff; 
    padding:10px 20px;
    display:flex; 
    justify-content:space-between; 
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1); 
    margin-bottom:20px;
  }

  nav a { 
    margin-right:15px; 
    text-decoration:none; 
    color: var(--primary-color); 
    font-weight:bold; 
  }

  .container { 
    display:flex; 
    flex-wrap:wrap; 
    gap:15px; 
    justify-content:center; 
  }

  .card {
    background:white; 
    border-radius:10px; 
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1); 
    width:250px; 
    transition:0.2s;
    text-align:center;
  }

  .card img { 
    width:100%; 
    border-radius:8px; 
    margin-bottom:10px; 
    cursor:pointer; 
  }

  .card:hover { transform:scale(1.03); }

  .art-description h3 { color: var(--primary-color); margin-bottom:5px; }
  .art-description p { margin-bottom:8px; font-size:14px; line-height:1.4; }

  form { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  form input, form textarea, form button { padding:10px; border-radius:6px; border:1px solid #ccc; }
  form button { background: var(--primary-color); color:white; border:none; cursor:pointer; }

  aside { background:white; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-top:20px; }

  /* MODAL */
  .modal { 
    display: none; 
    position: fixed; 
    z-index: 1000; 
    padding-top: 60px; 
    left: 0; top: 0; 
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgba(0,0,0,0.8);
  }

  .modal-content { margin: auto; display: block; max-width: 80%; max-height: 80%; border-radius: 10px; }
  .close { position: absolute; top: 20px; right: 35px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }

  /* API SEARCH RESULTS */
  #output {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
  }

  #output .card {
    width: 250px;
    background: white;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: 0.2s;
    text-align: center;
  }

  #output .card img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  #output .card .title {
    font-weight: bold;
    margin-bottom: 5px;
    color: var(--primary-color);
  }

  #output .card button {
    margin-top: 5px;
    padding: 8px 12px;
    border: none;
    background: var(--primary-color);
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }

  #output .card button:hover {
    background: darkorange;
  }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <h1>Welcome to ArtHub</h1>
  <select id="role">
    <option value="administrator">Administrator</option>
    <option value="client">Client</option>
    <option value="artist">Artist</option>
  </select>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <div id="loginMessage"></div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">
  <header>
    <h2>ArtHub: Creative Space</h2>
  </header>

  <nav class="nav-bar">
    <div>
      <a href="#intro">Home</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <div class="container">
    <input type="text" id="searchInput" placeholder="Search artworks...">
    <button id="btn">Search</button>
    <div id="output"></div>
  </div>

  <section class="card" id="intro">
    <h2>ArtHUB</h2>
    <img src="assets/Star.jpg" alt="Starry Night">
    <p>Welcome to our ArtHub! Explore artworks and discover artists.</p>
  </section>

  <div class="container" id="contact">
    <aside>
      <h3>Contact / Message Form</h3>
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <textarea rows="4" placeholder="Your message..." required></textarea>
        <button type="submit">Submit</button>
      </form>
    </aside>
  </div>

  <footer>
    <p>© 2025 ArtHub. All rights reserved.</p>
  </footer>
</div>

<!-- IMAGE MODAL -->
<div id="imgModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
  // ---------------- LOGIN FUNCTION ----------------
  function login() {
    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("loginMessage");

    const accounts = {
      administrator: { username: "administrator", password: "lifeof2004" },
      client: { username: "client123", password: "clientpass" },
      artist: { username: "artist123", password: "artistpass" }
    };

    if(username === accounts[role].username && password === accounts[role].password) {
      message.style.color = "green";
      message.innerText = `Welcome, ${role.toUpperCase()}!`;
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
      document.querySelector(".nav-bar").style.display = "flex";
    } else {
      message.style.color = "red";
      message.innerText = "Invalid credentials. Try again.";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelector(".nav-bar").style.display = "none";

    // Smooth scrolling
    document.querySelectorAll(".nav-bar a[href^='#']").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const target = document.querySelector(link.getAttribute("href"));
        if(target) target.scrollIntoView({ behavior:"smooth" });
      });
    });

    // Image modal
    const images = document.querySelectorAll('.card img');
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const closeBtn = modal.querySelector('.close');
    images.forEach(img => {
      img.onclick = () => { modal.style.display = 'block'; modalImg.src = img.src; }
    });
    closeBtn.onclick = () => modal.style.display = 'none';
    modal.onclick = e => { if(e.target===modal) modal.style.display='none'; }

    // Search API
    document.getElementById("btn").addEventListener("click", async () => {
      const query = document.getElementById("searchInput").value.trim();
      const output = document.getElementById("output");
      if(!query){ output.innerHTML="<p>Please enter a search term</p>"; return; }
      output.innerHTML="<p>Loading...</p>";
      try {
        const res = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(query)}&limit=20&fields=id,title,image_id,artist_title,api_link`);
        const data = await res.json();
        if(!data.data || data.data.length===0){ output.innerHTML="<p>No paintings found</p>"; return; }
        output.innerHTML="";
        data.data.forEach(artwork => {
          const imgUrl = artwork.image_id ? `https://www.artic.edu/iiif/2/${artwork.image_id}/full/843,/0/default.jpg` : '';
          const title = artwork.title || 'Untitled';
          const artist = artwork.artist_title || 'Unknown Artist';
          const moreLink = artwork.api_link || '#';
          output.innerHTML += `
            <div class="card">
              <img src="${imgUrl}" alt="${title}">
              <div class="title">${title}</div>
              <div>By: ${artist}</div>
              <button onclick="window.open('${moreLink}', '_blank')">More Info</button>
            </div>`;
        });
      } catch(err){
        output.innerHTML="<p>❌ Failed to load data</p>";
        console.error(err);
      }
    });
  });
</script>

</body>
</html>
