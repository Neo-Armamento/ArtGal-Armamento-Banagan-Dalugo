<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ArtHub — Contact</title>

  <!-- Use shared stylesheet if you have one; otherwise page includes minimal fallback styles below -->
  <link rel="stylesheet" href="styles.css" onerror="this.remove();">

  <style>
    /* Minimal fallback styles so this page looks good even without styles.css */
    :root{
      --primary-color: darkorange;
      --accent-color: #4fc3f7;
      --bg-top: #b3e5fc;
      --bg-bottom: #4fc3f7;
      --card-bg: #ffffff;
      --radius: 10px;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --max-width: 980px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    body{background:linear-gradient(to bottom,var(--bg-top),var(--bg-bottom));color:#222;padding-top:90px}
    .top-navbar{position:fixed;top:0;left:0;right:0;height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:1100}
    .nav-left{display:flex;gap:14px;align-items:center}
    .nav-left a{color:#333;text-decoration:none;font-weight:600;padding:8px 10px;border-radius:8px}
    .nav-left a.active{background:linear-gradient(90deg,var(--primary-color),var(--accent-color));color:#fff}
    .nav-center-badge{position:absolute;left:50%;transform:translateX(-50%);background:var(--primary-color);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;pointer-events:none}
    .full-padding-wrapper{min-height:calc(100vh - 90px);display:flex;justify-content:center;padding:6vh 3vw}
    .container{width:100%;max-width:var(--max-width)}
    .card{background:linear-gradient(180deg,#fff,#f7fbff);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow)}
    h1,h2{color:var(--primary-color);margin:0 0 12px}
    .lead{color:#444;margin-bottom:14px}
    form{display:flex;flex-direction:column;gap:10px}
    label{font-weight:700;font-size:14px}
    input[type="text"],input[type="email"],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:15px}
    textarea{min-height:140px;resize:vertical}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .btn{background:linear-gradient(90deg,var(--primary-color),var(--accent-color));color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
    .note{font-size:14px;color:#666}
    .status{min-height:1.2em;font-weight:700;margin-top:6px}
    @media (max-width:720px){ .full-padding-wrapper{padding:5vh 4vw} .nav-center-badge{display:none} }
  </style>
</head>
<body>
  <header class="top-navbar" role="banner" aria-label="Main navigation">
    <nav class="nav-left" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="commsion.html">Commissions</a>
      <a href="arts.html">Arts</a>
      <a href="contact.html" id="nav-contact">Contact</a>
    </nav>

    <div class="nav-center-badge" aria-hidden="true">ArtHUB</div>

    <div class="nav-right" aria-label="Actions">
      <a class="btn" href="account-page.html">Sign in</a>
    </div>
  </header>

  <main class="full-padding-wrapper" id="main">
    <div class="container">
      <section class="card" aria-labelledby="contactHeading">
        <h1 id="contactHeading">Contact Us</h1>
        <p class="lead">Have a question, commission request, or feedback? Send us a message and we’ll get back to you.</p>

        <form id="contactForm" novalidate>
          <label for="contactName">Your name</label>
          <input id="contactName" name="name" type="text" placeholder="Jane Doe" required />

          <label for="contactEmail">Your email</label>
          <input id="contactEmail" name="email" type="email" placeholder="you@example.com" required />

          <label for="contactSubject">Subject</label>
          <input id="contactSubject" name="subject" type="text" placeholder="Commission / Question / Other" />

          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" name="message" placeholder="Write your message here..." required></textarea>

          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <button type="submit" class="btn">Send message</button>
            <div id="contactStatus" class="status" aria-live="polite"></div>
          </div>
        </form>

        <div style="margin-top:12px" class="note">
          Prefer email? Send to <a href="mailto:info@arthub.example">info@arthub.example</a> (replace with your real address).
        </div>
      </section>
    </div>
  </main>

  <script>
    // highlight active nav link
    (function () {
      try {
        const navLinks = document.querySelectorAll('.nav-left a');
        navLinks.forEach(a => {
          const href = a.getAttribute('href');
          // consider both exact filename and optional leading slash
          if (location.pathname.endsWith(href) || location.pathname === '/' && href === 'home.html') {
            a.classList.add('active');
          }
        });
      } catch (e) { /* ignore */ }
    })();

    // client-side validation + simple UI behaviour
    const form = document.getElementById('contactForm');
    const status = document.getElementById('contactStatus');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      status.textContent = '';
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const message = form.message.value.trim();

      if (!name || !email || !message) {
        status.style.color = '#b00020';
        status.textContent = 'Please fill in name, email and message.';
        return;
      }

      // basic email format check
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        status.style.color = '#b00020';
        status.textContent = 'Please enter a valid email address.';
        return;
      }

      // Simulate send: in production replace with fetch to your backend or Supabase function
      status.style.color = '#066e3b';
      status.textContent = 'Sending…';

      // Simulate network delay
      setTimeout(() => {
        status.style.color = '#066e3b';
        status.textContent = 'Message sent. Thank you — we will get back to you soon.';
        form.reset();
      }, 700);

      // If you want, uncomment and update the block below to POST to your server endpoint:
      /*
      fetch('/api/contact', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, email, subject: form.subject.value.trim(), message})
      })
      .then(r => r.json())
      .then(resp => {
        status.style.color = '#066e3b';
        status.textContent = resp?.message || 'Message sent. Thank you.';
        form.reset();
      })
      .catch(err => {
        status.style.color = '#b00020';
        status.textContent = 'Failed to send message. Try again later.';
        console.error(err);
      });
      */
    });
  </script>
</body>
</html>
