<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ArtHub — Create account</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Small page-specific adjustments to keep the file self-contained */
    .center-card { max-width:480px; margin:72px auto; padding:20px; background: #fff; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
    .center-card h1 { margin:0 0 8px; color:var(--primary, #ff7a00); text-align:center; }
    .small-note { color:#666; font-size:14px; text-align:center; margin-bottom:12px; }
    .form-field { margin-bottom:12px; display:flex; flex-direction:column; gap:6px; }
    label { font-weight:700; font-size:13px; color:#333; }
    input, select { padding:10px 12px; border-radius:8px; border:1px solid #ddd; font-size:15px; }
    .actions { display:flex; gap:8px; align-items:center; margin-top:6px; }
    .btn { padding:10px 12px; background: linear-gradient(90deg,#ff7a00,#4fc3f7); color:#fff; font-weight:700; border:0; border-radius:8px; cursor:pointer; flex:1; }
    .link { text-decoration:underline; background:transparent; border:0; color:#666; cursor:pointer; }
    .status { min-height:20px; margin-top:10px; font-size:14px; text-align:center; }
  </style>
</head>
<body>
  <main>
    <div class="center-card">
      <h1>Create an account</h1>
      <div class="small-note">Create your ArtHub account — you will be signed in immediately and taken to the Home page.</div>

      <form id="createAccountForm" novalidate>
        <div class="form-field">
          <label for="fullName">Full name (optional)</label>
          <input id="fullName" name="fullName" type="text" placeholder="Your display name" />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" placeholder="At least 6 characters" required />
        </div>

        <div class="form-field">
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="artist">Artist</option>
            <option value="client">Client</option>
            <option value="administrator">Administrator</option>
          </select>
        </div>

        <div class="actions">
          <button id="createBtn" class="btn" type="submit">Create account</button>
        </div>

        <div class="status" id="status"></div>

        <div style="margin-top:12px;text-align:center;font-size:14px;">
          Already have an account? <a href="account-page.html" class="link">Sign in</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/create-account.js"></script>
</body>
</html>
